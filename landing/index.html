<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var k = 'uah-theme-preference';
        var v = localStorage.getItem(k);
        var dark = false;
        if (v === 'dark') dark = true;
        else if (v === 'light') dark = false;
        else dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Search engine ownership verification tags live in the static landing document head.
       Add future provider tags (Google, Bing, etc.) here and keep them after verification succeeds. -->
  <meta name="google-site-verification" content="qbLaNwcx_OeOrBgJ5Bn6U_CeS_C7ganwGjeimDhRRHw" />
  <meta name="description"
    content="UAH is a free, open-source job search and application tracking platform. One place for job discovery, resume parsing, and application management — no ads, no paywalls, no data selling.">
  <meta name="theme-color" content="#1F5C99">
  <meta property="og:title" content="UAH | Unified Application Hub">
  <meta property="og:description"
    content="Free, open-source job search and application tracking. Built for job seekers, not advertisers.">
  <meta property="og:url" content="https://uahapp.com">
  <title>UAH | Unified Application Hub</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
