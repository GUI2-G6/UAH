# ============================================================
# UAH DEV — Docker Compose
# ============================================================
#
# Services:
#   db        — Postgres 15 (no public ports)
#   backend   — FastAPI + Uvicorn (no public ports)
#   frontend  — Nginx serving Vue 3 build + /api proxy
#
# Network:
#   All services attach to the pre-existing "uah-infra" Docker
#   network so they can communicate with infrastructure services
#   (VPN, tunnels) managed outside this compose file.
#
# Access:
#   dev.uahapp.com → 10.8.0.1:80 (VPN-only)
#
# Usage:
#   docker compose up -d --build
#
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 15
  # ----------------------------------------------------------
  db:
    image: postgres:15
    container_name: uah-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    networks:
      - uah-infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NO ports exposed — backend reaches db via service name "db"

  # ----------------------------------------------------------
  # Redis 7 (parse queue)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: uah-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - uah-infra

  # ----------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uah-dev-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ENV: ${ENV:-dev}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      AUTH_NAMESPACE: ${AUTH_NAMESPACE:?AUTH_NAMESPACE required}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-uah_auth_dev}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?SESSION_COOKIE_NAME required}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_PATH: ${SESSION_COOKIE_PATH:-/}
      SESSION_COOKIE_HTTPS_ONLY: ${SESSION_COOKIE_HTTPS_ONLY:-false}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${GMAIL_TOKEN_ENCRYPTION_KEY:-}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_FIRST_NAME: ${ADMIN_BOOTSTRAP_FIRST_NAME:-}
      ADMIN_BOOTSTRAP_LAST_NAME: ${ADMIN_BOOTSTRAP_LAST_NAME:-}
      DEV_AUTH_TEST_ACCOUNT_ENABLED: ${DEV_AUTH_TEST_ACCOUNT_ENABLED:-false}
      DEV_AUTH_TEST_USERNAME: ${DEV_AUTH_TEST_USERNAME:-}
      DEV_AUTH_TEST_PASSWORD: ${DEV_AUTH_TEST_PASSWORD:-}
      DEV_AUTH_TEST_EMAIL: ${DEV_AUTH_TEST_EMAIL:-}
      DEV_AUTH_TEST_FIRST_NAME: ${DEV_AUTH_TEST_FIRST_NAME:-Dev}
      DEV_AUTH_TEST_LAST_NAME: ${DEV_AUTH_TEST_LAST_NAME:-Tester}
      DEV_AUTH_TEST_IS_ADMIN: ${DEV_AUTH_TEST_IS_ADMIN:-false}
      DEV_AUTH_TEST_ROTATE_PASSWORD: ${DEV_AUTH_TEST_ROTATE_PASSWORD:-true}

      # Email (SMTP)
      EMAILS_ENABLED: ${EMAILS_ENABLED:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-20}

      # OAuth and integrations
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REDIRECT_URI: ${GMAIL_REDIRECT_URI:-}
      MUSE_API_KEY: ${MUSE_API_KEY:-}

      # Z.AI (Resume OCR + LLM Parsing)
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_OCR_URL: ${ZAI_OCR_URL:-https://api.z.ai/api/paas/v4/layout_parsing}
      ZAI_LLM_URL: ${ZAI_LLM_URL:-https://api.z.ai/api/paas/v4/chat/completions}
      ZAI_LLM_MODEL: ${ZAI_LLM_MODEL:-GLM-4.7-Flash}

      # Local Ollama Pipeline (feature-flagged)
      USE_LOCAL_PIPELINE: ${USE_LOCAL_PIPELINE:-false}
      LOCAL_OCR_URL: ${LOCAL_OCR_URL:-http://10.8.0.8:11434}
      LOCAL_OCR_MODEL: ${LOCAL_OCR_MODEL:-glm-ocr-hires}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://10.8.0.8:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b}
      LOCAL_OCR_TIMEOUT: ${LOCAL_OCR_TIMEOUT:-120}
      LOCAL_LLM_TIMEOUT: ${LOCAL_LLM_TIMEOUT:-120}
      LOCAL_OCR_DPI: ${LOCAL_OCR_DPI:-120}

      # Redis Parse Queue (feature-flagged)
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://uah-redis:6379/0}
      PARSE_QUEUE_NAME: ${PARSE_QUEUE_NAME:-uah:parse_jobs}
      PARSE_QUEUE_NAME_CLOUD: ${PARSE_QUEUE_NAME_CLOUD:-uah:parse_jobs:cloud}
      PARSE_QUEUE_NAME_LOCAL: ${PARSE_QUEUE_NAME_LOCAL:-uah:parse_jobs:local}
      PARSE_QUEUE_NAME_RULES: ${PARSE_QUEUE_NAME_RULES:-uah:parse_jobs:rules}
      PARSE_QUEUE_MAX_RETRIES: ${PARSE_QUEUE_MAX_RETRIES:-3}
      PARSE_QUEUE_MAX_RETRIES_CLOUD: ${PARSE_QUEUE_MAX_RETRIES_CLOUD:-1}
      PARSE_QUEUE_MAX_RETRIES_LOCAL: ${PARSE_QUEUE_MAX_RETRIES_LOCAL:-1}
      PARSE_QUEUE_MAX_RETRIES_RULES: ${PARSE_QUEUE_MAX_RETRIES_RULES:-0}
      PARSE_QUEUE_CONCURRENCY_CLOUD: ${PARSE_QUEUE_CONCURRENCY_CLOUD:-1}
      PARSE_QUEUE_CONCURRENCY_LOCAL: ${PARSE_QUEUE_CONCURRENCY_LOCAL:-2}
      PARSE_QUEUE_CONCURRENCY_RULES: ${PARSE_QUEUE_CONCURRENCY_RULES:-2}
      PARSE_QUEUE_CLAIM_TTL_SECONDS: ${PARSE_QUEUE_CLAIM_TTL_SECONDS:-1800}
      PARSE_QUEUE_SHUTDOWN_DRAIN_SECONDS: ${PARSE_QUEUE_SHUTDOWN_DRAIN_SECONDS:-30}
      PARSE_QUEUE_STALE_JOB_MINUTES: ${PARSE_QUEUE_STALE_JOB_MINUTES:-20}

      # Search and Geolocation
      MUSE_PAGE_CHASE_ENABLED: ${MUSE_PAGE_CHASE_ENABLED:-true}
      MUSE_PAGE_CHASE_MAX_PAGES: ${MUSE_PAGE_CHASE_MAX_PAGES:-3}
      MUSE_PAGE_CHASE_MAX_API_CALLS_PER_REQUEST: ${MUSE_PAGE_CHASE_MAX_API_CALLS_PER_REQUEST:-3}
      MUSE_PAGE_CHASE_TARGET_ACCEPTED_RESULTS: ${MUSE_PAGE_CHASE_TARGET_ACCEPTED_RESULTS:-20}
      MUSE_PAGE_CHASE_MIN_FILTERED_RATIO: ${MUSE_PAGE_CHASE_MIN_FILTERED_RATIO:-0.4}
      MUSE_PAGE_CHASE_TIMEOUT_SECONDS: ${MUSE_PAGE_CHASE_TIMEOUT_SECONDS:-8}
      MUSE_ADAPTIVE_PAGE_CHASE_ENABLED: ${MUSE_ADAPTIVE_PAGE_CHASE_ENABLED:-true}
      MUSE_ADAPTIVE_PAGE_CHASE_EXTRA_PAGES: ${MUSE_ADAPTIVE_PAGE_CHASE_EXTRA_PAGES:-2}
      MUSE_ADAPTIVE_PAGE_CHASE_BREADTH_THRESHOLD: ${MUSE_ADAPTIVE_PAGE_CHASE_BREADTH_THRESHOLD:-45}
      MUSE_ADAPTIVE_PAGE_CHASE_MIN_FILTERED_RATIO: ${MUSE_ADAPTIVE_PAGE_CHASE_MIN_FILTERED_RATIO:-0.2}
      MUSE_LOCATION_PARAM_CAP: ${MUSE_LOCATION_PARAM_CAP:-60}
      CONSTRAINT_FILTER_MIN_CONFIDENCE: ${CONSTRAINT_FILTER_MIN_CONFIDENCE:-high}
      CONSTRAINT_COMPATIBILITY_ENABLED: ${CONSTRAINT_COMPATIBILITY_ENABLED:-true}
      JOBS_DEFAULT_PAGE_SIZE: ${JOBS_DEFAULT_PAGE_SIZE:-10}
      JOBS_CACHE_ENABLED: ${JOBS_CACHE_ENABLED:-true}
      JOBS_CACHE_TTL_SECONDS: ${JOBS_CACHE_TTL_SECONDS:-45}
      JOBS_CACHE_MAX_KEYS: ${JOBS_CACHE_MAX_KEYS:-250}
      MUSE_LOCATION_INDEX_ENABLED: ${MUSE_LOCATION_INDEX_ENABLED:-true}
      MUSE_LOCATION_INDEX_REFRESH_HOURS: ${MUSE_LOCATION_INDEX_REFRESH_HOURS:-24}
      MUSE_LOCATION_INDEX_SCAN_MAX_PAGES: ${MUSE_LOCATION_INDEX_SCAN_MAX_PAGES:-25}
      MUSE_LOCATION_INDEX_TIMEOUT_SECONDS: ${MUSE_LOCATION_INDEX_TIMEOUT_SECONDS:-10}
      MUSE_LOCATION_INDEX_RETENTION_DAYS: ${MUSE_LOCATION_INDEX_RETENTION_DAYS:-45}

      GEO_IP_PROVIDER: ${GEO_IP_PROVIDER:-ipapi}
      IPSTACK_API_KEY: ${IPSTACK_API_KEY:-}
      GEOLOCATION_AUTO_BUILD_DATASET: ${GEOLOCATION_AUTO_BUILD_DATASET:-true}
      GEOLOCATION_IGNORE_LOCAL_DATASET: ${GEOLOCATION_IGNORE_LOCAL_DATASET:-false}
      GEOLOCATION_DATASET_TIMEOUT_SECONDS: ${GEOLOCATION_DATASET_TIMEOUT_SECONDS:-90}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-UAH-JobBoard-Geolocation/1.0}
    volumes:
      - ./backend:/app          # Hot-reload in dev
    networks:
      - uah-infra
    # NO ports exposed — frontend proxies /api → backend:8000

  # ----------------------------------------------------------
  # Vue 3 Frontend (Nginx)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_NAMESPACE: ${VITE_AUTH_NAMESPACE:-dev}
        VITE_LOCAL_MODE: ${VITE_LOCAL_MODE:-backend}
    container_name: uah-dev-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:-dev.uahapp.com}
      DEV_TLS_ENABLED: ${DEV_TLS_ENABLED:-false}
      DEV_TLS_CERT_PATH: ${DEV_TLS_CERT_PATH:-/etc/nginx/certs/tls.crt}
      DEV_TLS_KEY_PATH: ${DEV_TLS_KEY_PATH:-/etc/nginx/certs/tls.key}
    volumes:
      - ./volumes/certs/dev:/etc/nginx/certs:ro
    # Share the VPN container's network namespace so nginx
    # listens directly on 10.8.0.1:80 (the wg0 interface).
    # This replaces ports + networks — both are inherited from VPN.
    network_mode: "container:uah-dev-vpn"

# ============================================================
# External network — created by infrastructure, NOT by compose
# ============================================================
volumes:
  redis_data:

networks:
  uah-infra:
    external: true

