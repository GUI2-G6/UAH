# ============================================================
# UAH DEV — Docker Compose
# ============================================================
#
# Services:
#   db        — Postgres 15 (no public ports)
#   backend   — FastAPI + Uvicorn (no public ports)
#   frontend  — Nginx serving Vue 3 build + /api proxy
#
# Network:
#   All services attach to the pre-existing "uah-infra" Docker
#   network so they can communicate with infrastructure services
#   (VPN, tunnels) managed outside this compose file.
#
# Access:
#   dev.uahapp.com → 10.8.0.1:80 (VPN-only)
#
# Usage:
#   docker compose up -d --build
#
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 15
  # ----------------------------------------------------------
  db:
    image: postgres:15
    container_name: uah-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    networks:
      - uah-infra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # NO ports exposed — backend reaches db via service name "db"

  # ----------------------------------------------------------
  # Redis 7 (parse queue)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: uah-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - uah-infra

  # ----------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uah-dev-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_FIRST_NAME: ${ADMIN_BOOTSTRAP_FIRST_NAME:-}
      ADMIN_BOOTSTRAP_LAST_NAME: ${ADMIN_BOOTSTRAP_LAST_NAME:-}

      # Email (SMTP)
      EMAILS_ENABLED: ${EMAILS_ENABLED:-false}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-20}

      # Z.AI (Resume OCR + LLM Parsing)
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      ZAI_OCR_URL: ${ZAI_OCR_URL:-https://api.z.ai/api/paas/v4/layout_parsing}
      ZAI_LLM_URL: ${ZAI_LLM_URL:-https://api.z.ai/api/paas/v4/chat/completions}
      ZAI_LLM_MODEL: ${ZAI_LLM_MODEL:-GLM-4.7-Flash}

      # Local Ollama Pipeline (feature-flagged)
      USE_LOCAL_PIPELINE: ${USE_LOCAL_PIPELINE:-false}
      LOCAL_OCR_URL: ${LOCAL_OCR_URL:-http://10.8.0.8:11434}
      LOCAL_OCR_MODEL: ${LOCAL_OCR_MODEL:-glm-ocr-hires}
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://10.8.0.8:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b}
      LOCAL_OCR_TIMEOUT: ${LOCAL_OCR_TIMEOUT:-120}
      LOCAL_LLM_TIMEOUT: ${LOCAL_LLM_TIMEOUT:-120}
      LOCAL_OCR_DPI: ${LOCAL_OCR_DPI:-120}

      # Redis Parse Queue (feature-flagged)
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      PARSE_QUEUE_NAME: ${PARSE_QUEUE_NAME:-uah:parse_jobs}
      PARSE_QUEUE_MAX_RETRIES: ${PARSE_QUEUE_MAX_RETRIES:-3}

      # Geolocation
      GEO_IP_PROVIDER: ${GEO_IP_PROVIDER:-ipapi}
      IPSTACK_API_KEY: ${IPSTACK_API_KEY:-}
      GEOLOCATION_AUTO_BUILD_DATASET: ${GEOLOCATION_AUTO_BUILD_DATASET:-true}
      GEOLOCATION_IGNORE_LOCAL_DATASET: ${GEOLOCATION_IGNORE_LOCAL_DATASET:-false}
      GEOLOCATION_DATASET_TIMEOUT_SECONDS: ${GEOLOCATION_DATASET_TIMEOUT_SECONDS:-90}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-UAH-JobBoard-Geolocation/1.0}
    volumes:
      - ./backend:/app          # Hot-reload in dev
    networks:
      - uah-infra
    # NO ports exposed — frontend proxies /api → backend:8000

  # ----------------------------------------------------------
  # Vue 3 Frontend (Nginx)
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uah-dev-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:-dev.uahapp.com}
      DEV_TLS_ENABLED: ${DEV_TLS_ENABLED:-false}
      DEV_TLS_CERT_PATH: ${DEV_TLS_CERT_PATH:-/etc/nginx/certs/tls.crt}
      DEV_TLS_KEY_PATH: ${DEV_TLS_KEY_PATH:-/etc/nginx/certs/tls.key}
    volumes:
      - ./volumes/certs/dev:/etc/nginx/certs:ro
    # Share the VPN container's network namespace so nginx
    # listens directly on 10.8.0.1:80 (the wg0 interface).
    # This replaces ports + networks — both are inherited from VPN.
    network_mode: "container:uah-dev-vpn"

# ============================================================
# External network — created by infrastructure, NOT by compose
# ============================================================
volumes:
  redis_data:

networks:
  uah-infra:
    external: true

