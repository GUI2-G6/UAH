name: Dev Branch Checks

on:
    pull_request:
        branches:
            - dev
            - beta
            - prod

jobs:
    frontend-build:
        name: Frontend Build Check
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build (production mode)
              run: npm run build

    backend-lint:
        name: Backend Syntax Check
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Check for syntax errors
              run: python -m py_compile $(find app -name "*.py" | tr '\n' ' ')

            - name: Run ruff linter (non-blocking warnings)
              run: |
                  pip install ruff
                  ruff check app --exit-zero
