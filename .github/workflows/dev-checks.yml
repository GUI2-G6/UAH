name: Dev Branch Checks

on:
  pull_request:
    branches:
      - dev
      - beta
      - prod

jobs:
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Enforce shared card contract
        run: npm run check:cards
      - name: Build (production mode)
        run: npm run build

  backend-lint:
    name: Backend Syntax Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check for syntax errors
        run: python -m py_compile $(find app -name "*.py" | tr '\n' ' ')
      - name: Run ruff linter (non-blocking warnings)
        run: |
          pip install ruff
          ruff check app --exit-zero

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        run: gitleaks detect --source . --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.sha }}" --verbose

  env-example-check:
    name: ENV Example Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check env-examples/dev/.env.example is in sync with config.py
        run: python .github/scripts/check_env_sync.py --template dev
      - name: Check env-examples/beta/.env.example is in sync with config.py
        run: python .github/scripts/check_env_sync.py --template beta

  dependency-audit:
    name: Dependency Vulnerability Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        continue-on-error: true
        run: |
          pip install pip-audit --break-system-packages -q
          pip-audit -r backend/requirements.txt --format markdown
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit frontend dependencies
        continue-on-error: true
        run: |
          cd frontend
          npm audit --audit-level=high
