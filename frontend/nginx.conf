# ============================================================
# UAH Frontend — Nginx Configuration
# ============================================================
#
# Serves the Vue 3 production build and proxies /api requests
# to the FastAPI backend container.
#
# Routing:
#   /api/*   → proxy to http://backend:8000
#   /*       → serve static files from /usr/share/nginx/html
#              with fallback to index.html for SPA routing
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------
    # API proxy — forwards /api requests to FastAPI backend
    # ----------------------------------------------------------
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow long-running parse/OCR requests up to 5 minutes
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        send_timeout          300s;
    }

    # ----------------------------------------------------------
    # Swagger / ReDoc / OpenAPI — proxy to FastAPI backend
    # ----------------------------------------------------------
    location /docs {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location /redoc {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    location /openapi.json {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
    }

    # ----------------------------------------------------------
    # SPA fallback — all other routes serve index.html
    # so Vue Router handles client-side routing
    # ----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ----------------------------------------------------------
    # Static asset caching
    # ----------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
