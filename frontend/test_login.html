<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAH OAuth Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f4f6;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .btn-google {
            background-color: #4285F4;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
            margin-top: 20px;
            transition: background-color 0.2s;
        }
        .btn-google:hover {
            background-color: #3367d6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>UAH App Authentication</h2>
        <p>Testing local FastAPI backend integration</p>
        
        <a href="http://localhost:8080/auth/google/" class="btn-google">
            Sign in with Google
        </a>
    </div>
</body>
</html>
