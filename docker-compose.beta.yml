# ============================================================
# UAH BETA — Docker Compose Override
# ============================================================
services:
  db:
    container_name: uah-beta-db
    volumes:
      - ./volumes/postgres_beta:/var/lib/postgresql/data
    networks:
      uah-beta-infra: {}
      uah-infra: null

  backend:
    container_name: uah-beta-backend
    user: "65534:65534"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-beta}
      ENV: ${ENV:-beta}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-uah_auth_beta}
      REDIS_URL: ${BETA_REDIS_URL:-redis://uah-beta-redis:6379/0}
      THE_MUSE_API_KEY: ${THE_MUSE_API_KEY:-}
      THE_MUSE_RATE_LIMIT_PER_HOUR: ${THE_MUSE_RATE_LIMIT_PER_HOUR:-1000}
      JOB_PROVIDER_CONTROLS_JSON: '${JOB_PROVIDER_CONTROLS_JSON:-{}}'
      ARBEITNOW_INTER_REQUEST_DELAY: ${ARBEITNOW_INTER_REQUEST_DELAY:-3.0}
      FINDWORK_API_KEY: ${FINDWORK_API_KEY:-}
      FINDWORK_INTER_REQUEST_DELAY: ${FINDWORK_INTER_REQUEST_DELAY:-6.0}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_DAILY_REQUEST_BUDGET: ${ADZUNA_DAILY_REQUEST_BUDGET:-200}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      JOOBLE_INTER_REQUEST_DELAY: ${JOOBLE_INTER_REQUEST_DELAY:-1.5}
      JOOBLE_PAGE_SIZE: ${JOOBLE_PAGE_SIZE:-50}
      JOB_SYNC_ENABLED: ${JOB_SYNC_ENABLED:-true}
      JOB_SYNC_STALE_THRESHOLD_HOURS: ${JOB_SYNC_STALE_THRESHOLD_HOURS:-6}
      JOB_SYNC_SOFT_DELETE_MISSES: ${JOB_SYNC_SOFT_DELETE_MISSES:-3}
      JOB_SYNC_HARD_PURGE_DAYS: ${JOB_SYNC_HARD_PURGE_DAYS:-180}
      JOB_SYNC_DISPATCH_INTERVAL_SECONDS: ${JOB_SYNC_DISPATCH_INTERVAL_SECONDS:-300}
      JOB_SYNC_CLEANUP_INTERVAL_SECONDS: ${JOB_SYNC_CLEANUP_INTERVAL_SECONDS:-3600}
      JOB_SYNC_LOCK_TTL_SECONDS: ${JOB_SYNC_LOCK_TTL_SECONDS:-900}
      JOB_SYNC_CLEANUP_LOCK_TTL_SECONDS: ${JOB_SYNC_CLEANUP_LOCK_TTL_SECONDS:-1800}
      JOB_COUNTRY_BACKFILL_BATCH_SIZE: ${JOB_COUNTRY_BACKFILL_BATCH_SIZE:-500}
      JOB_COUNTRY_BACKFILL_INTERVAL_SECONDS: ${JOB_COUNTRY_BACKFILL_INTERVAL_SECONDS:-86400}
      JOB_SYNC_CATEGORY_SCHEDULE_JSON: ${JOB_SYNC_CATEGORY_SCHEDULE_JSON:-}
      JOB_SYNC_ENABLED_PROVIDERS_JSON: '${JOB_SYNC_ENABLED_PROVIDERS_JSON:-["the_muse"]}'
      PARSE_QUEUE_NAME: ${BETA_PARSE_QUEUE_NAME:-uah:beta:parse_jobs}
      PARSE_QUEUE_NAME_CLOUD: ${BETA_PARSE_QUEUE_NAME_CLOUD:-uah:beta:parse_jobs:cloud}
      PARSE_QUEUE_NAME_LOCAL: ${BETA_PARSE_QUEUE_NAME_LOCAL:-uah:beta:parse_jobs:local}
      PARSE_QUEUE_NAME_RULES: ${BETA_PARSE_QUEUE_NAME_RULES:-uah:beta:parse_jobs:rules}
      BETA_ACCESS_NOTIFY_EMAIL: ${BETA_ACCESS_NOTIFY_EMAIL:-beta@uahapp.com}
      LANDING_FEEDBACK_NOTIFY_EMAIL: ${LANDING_FEEDBACK_NOTIFY_EMAIL:-feedback@uahapp.com}
    networks:
      uah-beta-infra: {}
      uah-infra: null

  celery_worker:
    container_name: uah-beta-celery-worker
    user: "65534:65534"
    environment:
      REDIS_URL: ${BETA_REDIS_URL:-redis://uah-beta-redis:6379/0}
      JOB_PROVIDER_CONTROLS_JSON: '${JOB_PROVIDER_CONTROLS_JSON:-{}}'
      ARBEITNOW_INTER_REQUEST_DELAY: ${ARBEITNOW_INTER_REQUEST_DELAY:-3.0}
      FINDWORK_API_KEY: ${FINDWORK_API_KEY:-}
      FINDWORK_INTER_REQUEST_DELAY: ${FINDWORK_INTER_REQUEST_DELAY:-6.0}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_DAILY_REQUEST_BUDGET: ${ADZUNA_DAILY_REQUEST_BUDGET:-200}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      JOOBLE_INTER_REQUEST_DELAY: ${JOOBLE_INTER_REQUEST_DELAY:-1.5}
      JOOBLE_PAGE_SIZE: ${JOOBLE_PAGE_SIZE:-50}
      JOB_COUNTRY_BACKFILL_BATCH_SIZE: ${JOB_COUNTRY_BACKFILL_BATCH_SIZE:-500}
      JOB_COUNTRY_BACKFILL_INTERVAL_SECONDS: ${JOB_COUNTRY_BACKFILL_INTERVAL_SECONDS:-86400}
    networks:
      uah-beta-infra: {}
      uah-infra: null

  celery_beat:
    container_name: uah-beta-celery-beat
    user: "65534:65534"
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=info", "--scheduler", "celery.beat.PersistentScheduler", "--schedule", "/tmp/celerybeat-schedule"]
    environment:
      REDIS_URL: ${BETA_REDIS_URL:-redis://uah-beta-redis:6379/0}
      JOB_PROVIDER_CONTROLS_JSON: '${JOB_PROVIDER_CONTROLS_JSON:-{}}'
      ARBEITNOW_INTER_REQUEST_DELAY: ${ARBEITNOW_INTER_REQUEST_DELAY:-3.0}
      FINDWORK_API_KEY: ${FINDWORK_API_KEY:-}
      FINDWORK_INTER_REQUEST_DELAY: ${FINDWORK_INTER_REQUEST_DELAY:-6.0}
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      ADZUNA_DAILY_REQUEST_BUDGET: ${ADZUNA_DAILY_REQUEST_BUDGET:-200}
      JOOBLE_API_KEY: ${JOOBLE_API_KEY:-}
      JOOBLE_INTER_REQUEST_DELAY: ${JOOBLE_INTER_REQUEST_DELAY:-1.5}
      JOOBLE_PAGE_SIZE: ${JOOBLE_PAGE_SIZE:-50}
      JOB_COUNTRY_BACKFILL_BATCH_SIZE: ${JOB_COUNTRY_BACKFILL_BATCH_SIZE:-500}
      JOB_COUNTRY_BACKFILL_INTERVAL_SECONDS: ${JOB_COUNTRY_BACKFILL_INTERVAL_SECONDS:-86400}
    networks:
      uah-beta-infra: {}
      uah-infra: null

  redis:
    container_name: uah-beta-redis
    ports:
      - "127.0.0.1:${BETA_REDIS_HOST_PORT:-6380}:6379"
    networks:
      uah-beta-infra: {}

  frontend:
    container_name: uah-beta-frontend
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:-beta.uahapp.com}
      DEV_TLS_ENABLED: "false"
    volumes:
      - ./volumes/certs/beta:/etc/nginx/certs:ro
    network_mode: "service:cloudflared"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  landing:
    container_name: uah-landing
    restart: unless-stopped
    build:
      context: .
      dockerfile: landing/Dockerfile
    networks:
      uah-beta-infra: {}

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.3.0}
    container_name: uah-beta-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_BETA_TUNNEL_TOKEN}
    networks:
      uah-beta-infra: {}
      uah-infra: null

networks:
  uah-beta-infra:
    external: true
  uah-infra:
    external: true
