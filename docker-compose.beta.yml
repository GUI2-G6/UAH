# ============================================================
# UAH BETA — Docker Compose Override
# ============================================================
services:
  db:
    container_name: uah-beta-db
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    networks:
      uah-beta-infra: {}
      uah-infra: null

  backend:
    container_name: uah-beta-backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-beta}
      ENV: ${ENV:-beta}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-uah_auth_beta}
      REDIS_URL: ${BETA_REDIS_URL:-redis://uah-beta-redis:6379/0}
      PARSE_QUEUE_NAME: ${BETA_PARSE_QUEUE_NAME:-uah:beta:parse_jobs}
      PARSE_QUEUE_NAME_CLOUD: ${BETA_PARSE_QUEUE_NAME_CLOUD:-uah:beta:parse_jobs:cloud}
      PARSE_QUEUE_NAME_LOCAL: ${BETA_PARSE_QUEUE_NAME_LOCAL:-uah:beta:parse_jobs:local}
      PARSE_QUEUE_NAME_RULES: ${BETA_PARSE_QUEUE_NAME_RULES:-uah:beta:parse_jobs:rules}
    volumes:
      - ./backend:/app
    networks:
      uah-beta-infra: {}
      uah-infra: null

  redis:
    container_name: uah-beta-redis
    ports:
      - "127.0.0.1:${BETA_REDIS_HOST_PORT:-6380}:6379"
    networks:
      uah-beta-infra: {}

  frontend:
    container_name: uah-beta-frontend
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:-beta.uahapp.com}
      DEV_TLS_ENABLED: "false"
    volumes:
      - ./volumes/certs/beta:/etc/nginx/certs:ro
    network_mode: "service:cloudflared"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: uah-beta-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_BETA_TUNNEL_TOKEN}
    networks:
      uah-beta-infra: {}
      uah-infra: null

networks:
  uah-beta-infra:
    external: true
  uah-infra:
    external: true
